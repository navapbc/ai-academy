name: Deploy

on:
  push:
    branches:
      - main      # -> staging (auto)
      - release   # -> prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run test

  deploy:
    name: >-
      Deploy to ${{
        (github.ref_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'))
        && 'prod' || 'staging'
      }}
    needs: test
    runs-on: ubuntu-latest

    # Maps to a GitHub environment with scoped secrets + optional reviewers.
    # workflow_dispatch: uses the selected input.
    # push: release -> production, everything else -> staging.
    environment: >-
      ${{
        (github.ref_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'))
        && 'production' || 'staging'
      }}

    permissions:
      id-token: write   # required for OIDC role assumption
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Vite inlines VITE_* vars into the bundle at build time. The anon key is
      # public by design (RLS protects the data) — these point the SPA at the
      # hosted Supabase project for this environment.
      - name: Build site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # --- Backend FIRST: Supabase (replaces the other project's Lambda deploys)
      # Migrations + Edge Functions deploy BEFORE the client publish (restructure
      # U1): a failed migration must abort the job before any client ships, and
      # already-open tabs keep a forward-compatible window (new columns nullable,
      # replacement views created before old consumers are removed).
      # The API key never goes in GitHub — set it once on the Supabase project
      # with `supabase secrets set ANTHROPIC_API_KEY=...` (or in the dashboard).
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0   # matches the local CLI pin in package.json

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      # --- Client second: only publishes once the schema/functions are live. --
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy static site to S3
        run: |
          # Hashed assets — long cache (1 year), immutable
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

          # HTML — no cache (always revalidate)
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
            --delete \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*.html"
