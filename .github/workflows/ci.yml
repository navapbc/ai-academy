name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Unit + component tests (vitest). The Supabase integration tests in
      # progress.test.ts SKIP automatically when no live local stack is
      # reachable (no VITE_SUPABASE_* / no `supabase start`), so this stays
      # green in CI without a database. E2E (Playwright) is intentionally NOT
      # run here — it needs the local Supabase stack + a stubbed Claude; see the
      # commented job below and docs/DEBT-REPORT.md for the local run.
      - run: npm run test

  # DB-gated integration tests (audit W2-5 / D-07): the RLS/trigger suite
  # (rls.integration.test.ts, RUN_DB_TESTS=1) and the live-stack data-layer
  # suite (progress.test.ts) previously NEVER ran in CI — which is exactly how
  # a failing provenance invariant hid on main. This job stands up the local
  # Supabase stack (Docker is available on ubuntu-latest; the CLI is a
  # devDependency) and runs the full vitest suite against it, so the gated
  # suites execute instead of skipping. No secrets: the stack generates its
  # own local keys, read back via `supabase status -o env`.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx supabase start
      - name: Run vitest against the live local stack (gated suites included)
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_ANON_KEY="$PUBLISHABLE_KEY"
          RUN_DB_TESTS=1 npm run test

  # TODO(e2e): enable once CI provisions a local Supabase stack (supabase start)
  # and a seeded @navapbc.com user. The specs in e2e/ STUB the Claude/Anthropic
  # call at the network layer (intercept POST **/functions/v1/chat), so no
  # ANTHROPIC_API_KEY is needed — only the DB + dev server. Run locally with:
  #   npx supabase start && npx playwright install --with-deps chromium && npm run test:e2e
