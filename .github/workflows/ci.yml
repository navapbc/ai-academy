  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '22'
  #         cache: 'npm'
  #     - run: npm ci
  #     - run: npx playwright install --with-deps chromium
  #     - run: npx supabase start
  #     - run: npm run test:e2e
